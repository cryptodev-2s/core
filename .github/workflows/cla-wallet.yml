name: CLA - @metamask/wallet

on:
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - opened
      - synchronize
      - closed
  merge_group: # skipped jobs count as passing, so required checks still work.

concurrency:
  # issue_comment → fixed "signatures" key so all signature commits serialize
  # (two concurrent cla.json writes with the same SHA would 409).
  # pull_request_target → per-PR-number key so concurrent PRs don't cancel each other.
  # Both events report refs/heads/main as github.ref, so we can't use that.
  group: ${{ github.workflow }}-${{ github.event_name == 'issue_comment' && 'signatures' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  cla-wallet:
    uses: ./.github/workflows/cla-package.yml
    with:
      package-path: packages/wallet
      package-name: '@metamask/wallet'
      signature-file: cla/wallet.json
      # TEMPORARY, fork testing only. Drop before opening the MetaMask/core PR.
      # Empty allowlist lets the fork owner be a required signer.
      # allow-organization-members must be false on a user-account fork (orgs.listMembers 404s).
      allowlist: ''
      allow-organization-members: false

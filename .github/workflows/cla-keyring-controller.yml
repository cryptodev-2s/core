name: CLA - @metamask/keyring-controller

on:
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - opened
      - synchronize
      - closed
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'issue_comment' && 'signatures' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  cla-keyring-controller:
    uses: ./.github/workflows/cla-package.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      package-path: packages/keyring-controller
      package-name: '@metamask/keyring-controller'
      signature-file: cla/keyring-controller.json
      # TEMPORARY, fork testing only. Drop before opening the MetaMask/core PR.
      allowlist: ''
      allow-organization-members: false

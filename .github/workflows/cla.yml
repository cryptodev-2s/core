name: CLA Signature Bot

on:
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - opened
      - synchronize
      - closed
  # Required checks have to report against the merge queue's ref, so this fires
  # here too. Both jobs skip, and a skipped job counts as a passing check.
  merge_group:

concurrency:
  # `issue_comment` reports `refs/heads/main` as the ref no matter which pull
  # request the comment is on, so every signature shares one group and they
  # serialize. That is deliberate: the action reads `cla.json` and writes it back
  # with the SHA it read, so two signatures recorded at once would collide.
  #
  # `pull_request_target` reports `refs/pull/<number>/merge`, giving one group
  # per pull request, where cancelling a superseded run is what we want.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  touches-wallet:
    name: Determine whether this PR touches packages/wallet
    if: github.event_name == 'pull_request_target' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # Read the pull request's changed file list.
    outputs:
      touches-wallet: ${{ steps.touches-wallet.outputs.touches-wallet }}
    steps:
      - name: Determine whether this PR touches packages/wallet
        id: touches-wallet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Collect the file list before matching. Piping `gh api` straight into
          # `grep -q` makes `grep` exit on its first match, which SIGPIPEs `gh`
          # and trips `pipefail`, reporting `false` for PRs that do touch the
          # package.
          FILES="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"

          # The trailing slash keeps sibling packages such as `packages/wallet-cli`
          # from matching.
          if grep -q '^packages/wallet/' <<< "$FILES"; then
            echo 'touches-wallet=true' >> "$GITHUB_OUTPUT"
          else
            echo 'touches-wallet=false' >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  cla-signature-bot:
    name: CLA Signature Bot
    needs: touches-wallet
    if: needs.touches-wallet.outputs.touches-wallet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Kept identical to the extension's CLA workflow on purpose. `contents`
      # covers the signature commit, `pull-requests` the status comment.
      #
      # Known gap: after recording a signature the action also re-runs the pull
      # request's blocking check, which needs `actions: write` and 403s without
      # it. The signature still lands and the comment still updates, but the
      # failing check has to be re-run by hand, which is what the bot's own
      # comment already tells contributors to do. Worth revisiting alongside the
      # extension rather than diverging here.
      contents: write # Commit signatures to the `cla-signatures` branch.
      pull-requests: write # Post and update the signature status comment.
    steps:
      - name: CLA Signature Bot
        uses: MetaMask/cla-signature-bot@v4.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Namespaced per package from the start. Consent is per package, so a
          # second scope later gets its own file instead of us having to move
          # signatures that are already on record.
          path-to-signatures: 'cla/wallet.json'
          url-to-cladocument: 'https://metamask.io/cla'
          # This branch can't have protections, commits are made directly to the specified branch.
          branch: 'cla-signatures'
          # Scoped to the package deliberately. With the default sentence every
          # signature collected now would be ambiguous once a second package is
          # added, and the default regex has no end anchor, so the generic
          # sentence would still match and sign this scope.
          signature-text: 'I have read the CLA Document and I hereby sign the CLA for @metamask/wallet'
          # Matched against the comment body after it is uppercased. The trailing
          # lookahead stops a signature for a future `@metamask/wallet-cli` from
          # also signing this scope, since the package name is a prefix of it.
          signature-regex: '^.*I\s*HAVE\s*READ\s*THE\s*CLA\s*DOCUMENT\s*AND\s*I\s*HEREBY\s*SIGN\s*THE\s*CLA\s*FOR\s*@METAMASK/WALLET(?![\w-])'
          # TEMPORARY, fork testing only. Drop this commit before opening the
          # MetaMask/core pull request.
          #
          # The allowlist is emptied so the fork owner counts as a required
          # signer and the unsigned path can be exercised without a second
          # account.
          #
          # `allow-organization-members` has to be false on a fork owned by a
          # user account. The action calls `orgs.listMembers` with the
          # repository owner, which 404s for a user and throws unhandled.
          allowlist: ''
          allow-organization-members: false
          blockchain-storage-flag: false
